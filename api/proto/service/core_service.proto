message QueryGdAppInfoRequest {
    uint64 id = 1;
    string msg_trace_id = 2;
}

message QueryGdAppInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    GdAppInfo info = 2;
}

//////////////////////////////////////////////////////////////////////////////////////////////////////

message PcAppInfo {
    uint64 id = 1;
    string app_id = 2;
    string app_secret = 3;
    string name = 4;
    string desc = 5;
    string gd_app_id = 6;       // 反垃圾应用 ID
    string created_at = 7;
    string updated_at = 8;
    string business_url = 9;    // 业务反垃圾 URL
    bool err_pass = 10;         // 业务出错时是否放行
}

message CreatePcAppRequest {
    string name = 1;
    string desc = 2;
    string gd_app_id = 3;       // 反垃圾应用 ID
    string third_party_app_key = 4;      // 第三方应用 AppKey
    string third_party_app_secret = 5;   // 第三方应用 AppSecret
    string msg_trace_id = 6;
    string business_url = 7;    // 业务反垃圾 URL
    bool err_pass = 8;          // 业务出错时是否放行
}

message CreatePcAppReply {
    orbikit.service.UnifiedResponse ret = 1;
    PcAppInfo info = 2;
}

message UpdatePcAppInfoRequest {
    uint64 id = 1;
    bool is_refresh_secret = 2;
    string name = 3;
    string desc = 4;
    string msg_trace_id = 5;
    string business_url = 6;    // 业务反垃圾 URL
    bool err_pass = 7;          // 业务出错时是否放行
}

message UpdatePcAppInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    PcAppInfo info = 2;
}

message BindPcFilterAppRequest {
    uint64 id = 1;
    string gd_app_id = 2;
    string msg_trace_id = 3;
}

message BindPcFilterAppReply {
    orbikit.service.UnifiedResponse ret = 1;
    PcAppInfo info = 2;
}

message QueryPcAppInfoRequest {
    uint64 id = 1;
    string msg_trace_id = 2;
}

message QueryPcAppInfoByAppIDRequest {
    string app_id = 1;
    string msg_trace_id = 2;
}

message QueryPcAppInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    PcAppInfo info = 2;
}

service Core {
    rpc CreateApp (CreateAppRequest) returns (CreateAppReply) {
    }
    rpc QueryAppInfo (QueryAppInfoRequest) returns (QueryAppInfoReply) {
    }
    rpc IsAppValid (IsAppValidRequest) returns (IsAppValidReply) {
    }
    rpc ApplyClientLoginToken (ApplyClientLoginTokenRequest) returns (ApplyClientLoginTokenReply) {
    }
    rpc GetClientLoginTokenInfo (GetClientLoginTokenInfoRequest) returns (GetClientLoginTokenInfoReply) {
    }
    rpc DeleteClientLoginToken (DeleteClientLoginTokenReq) returns (DeleteClientLoginTokenResp) {
    }
    rpc UpdateAppInfo (UpdateAppInfoRequest) returns (UpdateAppInfoReply) {
    }
    rpc RestraintUserOperator (RestraintUserOperatorRequest) returns (RestraintUserOperatorReply) {
    }
    rpc GetAppSecret (GetAppSecretRequest) returns (GetAppSecretReply) {
    }
    rpc GetAllAppMsgCpQPS (GetAllAppMsgCpQPSRequest) returns (GetAllAppMsgCpQPSReply) {
    }
    rpc UpdateAppCacheInfo(UpdateAppCacheInfoRequest) returns (UpdateAppCacheInfoReply) {
    }
    rpc CreateGdApp (CreateGdAppRequest) returns (CreateGdAppReply) {
    }
    rpc UpdateGdAppInfo (UpdateGdAppInfoRequest) returns (UpdateGdAppInfoReply) {
    }
    rpc GetGdAppSecret (GetGdAppSecretRequest) returns (GetGdAppSecretReply) {
    }
    rpc QueryGdAppInfo (QueryGdAppInfoRequest) returns (QueryGdAppInfoReply) {
    }
    rpc GetGdAppOfAppSecret (GetGdAppSecretOfAppRequest) returns (GetGdAppSecretOfAppReply) {
    }
    rpc CreatePcApp (CreatePcAppRequest) returns (CreatePcAppReply) {
    }
    rpc UpdatePcAppInfo (UpdatePcAppInfoRequest) returns (UpdatePcAppInfoReply) {
    }
    rpc BindPcFilterApp (BindPcFilterAppRequest) returns (BindPcFilterAppReply) {
    }
    rpc QueryPcAppInfo (QueryPcAppInfoRequest) returns (QueryPcAppInfoReply) {
    }
    rpc QueryPcAppInfoByAppID (QueryPcAppInfoByAppIDRequest) returns (QueryPcAppInfoReply) {
    }
}

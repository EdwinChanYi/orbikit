syntax = "proto3";

package roomkit.service;

option go_package = "github.com/yourname/roomkit/api/gen/servicepb;servicepb";

import "service_comm.proto";

// 权限列表
enum Privilege {
    UNDEFINED = 0; // 未定义
    EDIT_CHATROOM_INFO = 1; // 修改房间信息
    MUTE = 2; // 禁言
    BLOCK = 3; // 拉黑
    SET_MANAGER = 4; // 设置/取消管理员
    KICK = 5; // 踢人
    EDIT_MICRO = 6; // 修改成员麦序
    EDIT_MICRO_STATUS = 7; // 修改麦序信息
    MUTE_MESSAGE = 8; // 全房间禁言
    MUTE_CAN_MESSAGE = 9; // 房间禁言的时候还可以说话
}

message UpdateAppCustomInfoKeyFilterRequest {
    string app_id = 1;
    repeated string custom_info_key_filter = 8;
    string msg_trace_id = 9;
}

message UpdateAppCustomInfoKeyFilterReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 创建房间
message CreateChatroomRequest {
    string app_id = 1;
    ChatroomInfo chatroom_info = 2;
    bool need_open = 3;
    repeated SpaceInfos space = 4;
    string msg_trace_id = 5;
}

message CreateChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 封/解封 房间
message BlockChatroomRequest {
    string app_id = 1;
    int64 room_id = 2;
    int32 action = 3;
    string msg_trace_id = 4;
}

message BlockChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message RolePermission {
    int32 action_type = 1;
    bool can_do_action = 2;
    int32 initiative_level = 3;
    int32 passivity_level = 4;
}

// 创建角色
message CreateRoleRequest {
    string app_id = 1;
    string name = 2;
    int64 role_id = 3;
    repeated RolePermission permissions = 4;
    string msg_trace_id = 5;
    bool keep_on_closed = 6;
}

message CreateRoleReply {
    roomkit.service.UnifiedResponse ret = 1;
}
message QueryRoleRequest {
    string app_id = 1;
    repeated int64 role_id = 2;
    string msg_trace_id = 3;
}
message role {
    int64 role_id = 1;
    string role_name = 2;
    repeated RolePermission permissions = 3;
    bool keep_on_closed = 4;
}
message QueryRoleReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated role roles = 2;
}
message ModifyRoleRequest {
    string app_id = 1;
    int64 role_id = 2;
    repeated RolePermission permissions = 3;
    string msg_trace_id = 4;
    bool keep_on_closed = 5;
}
message ModifyRoleReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message RemoveUserRoleRequest {
    string app_id = 1;
    int64 uid = 2;
    int64 room_id = 3;
    int64 role_id = 4;
    string msg_trace_id = 5;
}
message RemoveUserRoleReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 设置用户角色
message SetRoleRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    repeated int64 role_id = 4;
    string msg_trace_id = 5;
}

message SetRoleReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 开启房间
message OpenChatroomRequest {
    string app_id = 1;
    int64 room_id = 2;
    repeated SpaceInfos space = 3;
    string msg_trace_id = 4;
}

message OpenChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 关闭房间
message CloseChatroomRequest {
    string app_id = 1;
    int64 room_id = 2;
    string msg_trace_id = 3;
}

message CloseChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message ApplyEnterChatroomTokenRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    ChatroomMemberInfo member_info = 4;
    string msg_trace_id = 5;
}

message ApplyEnterChatroomTokenReply {
    roomkit.service.UnifiedResponse ret = 1;
    string token = 2;
}

// 进入房间
message EnterChatroomRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    string token = 4;
    string msg_trace_id = 5;
}

message ChatroomInfo {
    int64 chatroom_id = 1; // 聊天室ID
    string name = 2; // 聊天室名
    string announcement = 3; // 公告
    int64 owner_uid = 4; // 房主
    map<string, string> ext = 5; // 服务端设置的房间扩展字段，客户端不能设置
    int64 online_count = 6; // 当前在线人数
    bool is_mute_all = 7; // 聊天室是否正在全员禁言标记，禁言后只有管理员可以发言
    repeated string custom_info_key_filter = 8;
    int64 robot_count=9;
}

message ChatroomMemberInfo {
    int64 uid = 1; // 用户id
    string nickname = 2; // 聊天室内的昵称字段，由用户进聊天室时提交。
    string avatar = 3; // 聊天室内的头像字段，由用户进聊天室时提交。
    map<string, string> custom_info = 4; // 该字段是业务服务器在开房间的时候设的用户信息Keys，聊天室服务器会去业务数据库代理查询该用户在业务的服务器该Keys下的数据
    map<string, string> chatroom_remote_ext = 5; // 聊天室人员扩展字段,由业务服务器设置
    repeated int32 role_id = 6; // 聊天室角色，可以自定义
    bool is_in_block_list = 7; // 是否在黑名单中
    bool is_in_kick_list = 8;
    bool is_in_mute_list = 9;
    bool is_online = 10; // 是否在线，仅特殊成员（房主、管理员、被拉黑、被禁言、被踢）才可能离线,
    // 对游客用户而言只能是在线
    int64 enter_time = 11; // 进入聊天室的时间点(毫秒)
    map<string, string> search_keys = 12;
    bool is_reboot = 13;
    int64 mute_begin = 14;
    int64 mute_finish = 15;
    int64 kick_begin = 16;
    int64 kick_finish = 17;
}

message EnterChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
    ChatroomInfo room_info = 2;
    ChatroomMemberInfo yourself_info = 3;
}

// 离开房间
message LeaveChatroomRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    string msg_trace_id = 4;
}

message LeaveChatroomReply {
    roomkit.service.UnifiedResponse ret = 1;
}

// 锁/解锁 mic位
message BlockMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    int32 action = 5;
    string msg_trace_id = 6;
}

message BlockMicReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated MicInfo mic_info = 2;
}

// 设置/解除 mic禁言
message MuteMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    int32 action = 5;
    string msg_trace_id = 6;
}

message MuteMicReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated MicInfo mic_info = 2;
}

// 查询所有mic位信息
message QueryMicInfoRequest {
    string app_id = 1;
    int64 room_id = 2;
    string msg_trace_id = 3;
    int64 uid = 4;
}

message MicInfo {
    int32 position = 1; // 麦的序号
    bool is_locked = 2; // 麦位的状态
    bool is_muted = 3; // 麦位的麦克风状态
    ChatroomMemberInfo member_info = 4; // 房间用户信息对象，带CustomInfo
    map<string, string> ext = 5; // 麦序扩展字段，一般交由服务端修改最好
}

message QueryMicInfoReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated MicInfo mic_info = 2;
}

// 更新麦位令牌
message UpdateMicTokenRequest {
    string token = 1; // 麦位令牌
    string app_id = 2;
    int64 room_id = 3; // 房间号
    int64 uid = 4;
    string msg_trace_id = 5;
}

message UpdateMicTokenReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message SpaceInfos {
    int32 index = 1;
    bool is_locked = 2;
    bool is_mute = 3;
    bool is_user = 4;
    int64 uid = 5;
    map<string, string> ext = 6;
}

message UpdateMicSpaceRequest {
    int64 room_id = 1;
    string app_id = 2;
    repeated SpaceInfos space = 3;
    string msg_trace_id = 4;
}

message UpdateMicSpaceReply {
    roomkit.service.UnifiedResponse ret = 1;
}
message SpaceInfosExt {
    int32 index = 1;
    map<string, string> ext = 6;
}
message UpdateMicSpaceExtRequest {
    int64 room_id = 1;
    string app_id = 2;
    repeated SpaceInfosExt spacesExt = 3;
    string msg_trace_id = 4;
}
message UpdateMicSpaceExtReply {
    roomkit.service.UnifiedResponse ret = 1;
}
message InviteMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    int64 invite_uid = 5;
    string msg_trace_id = 6;
}

message InviteMicReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message KickMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    int64 kic_uid = 5;
    map<string, string> ext = 6;
    string msg_trace_id = 7;
}

message KickMicMicReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message UpMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    string msg_trace_id = 5;
}

message UpMicReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message DownMicRequest {
    string app_id = 1;
    int64 room_id = 2;
    int64 uid = 3;
    int32 mic_index = 4;
    string msg_trace_id = 5;
}

message DownMicReply {
    roomkit.service.UnifiedResponse ret = 1;
}

message SubscribeChatroomBroadcastRequest {
    uint32 machine_id = 1;
    string msg_trace_id = 2;
}

enum ClientType {
    CLIENT_TYPE_UNDEFINED = 0; // 未知设备
    CLIENT_TYPE_ANDROID = 1; // 安卓
    CLIENT_TYPE_IOS = 2; // iOS
    CLIENT_TYPE_PC = 3; // WINDOWS
    CLIENT_TYPE_MACOS = 4; // MACOS
    CLIENT_TYPE_WEB = 5; // WEB
    CLIENT_TYPE_RESTFUL = 6; // RESTFUL API
    CLIENT_TYPE_SYSTEM = 8; // system msg
}

enum ChatroomMsgType {
    CHATROOM_MSG_TYPE_UNDEFINED = 0;
    CHATROOM_MSG_TYPE_TEXT = 1;
    CHATROOM_MSG_TYPE_CUSTOM = 2;
    CHATROOM_MSG_TYPE_EVENT = 3;
    CHATROOM_MSG_TYPE_ALL = 255;
}

enum ChatroomEventType {
    CHATROOM_EVENTTYPE_UNDEFINED = 0; // 未定义
    CHATROOM_EVENTTYPE_ENTER = 1; // 成员进入聊天室
    CHATROOM_EVENTTYPE_EXIT = 2; // 成员离开聊天室
    CHATROOM_EVENTTYPE_ADDBLACK = 3; // 成员被拉黑
    CHATROOM_EVENTTYPE_REMOVEBLACK = 4; // 成员被取消拉黑
    CHATROOM_EVENTTYPE_ADDMUTE = 5; // 成员被设置禁言
    CHATROOM_EVENTTYPE_REMOVEMUTE = 6; // 成员被取消禁言
    CHATROOM_EVENTTYPE_ADDMANAGER = 7; // 设置为管理员
    CHATROOM_EVENTTYPE_REMOVEMANAGER = 8; // 移除管理员
    CHATROOM_EVENTTYPE_CLOSED = 9; // 聊天室被关闭
    CHATROOM_EVENTTYPE_INFOUPDATED = 10; // 聊天室信息更新
    CHATROOM_EVENTTYPE_KICKED = 11; // 聊天室成员被踢
    CHATROOM_EVENTTYPE_UNKICKED = 12; // 聊天室成员被解除踢出
    CHATROOM_EVENTTYPE_MEMBERUPDATEINFO = 13; // 成员更新了聊天室的角色信息
    CHATROOM_EVENTTYPE_MICROCHANGE = 14; // 麦位人员变更
    CHATROOM_EVENTTYPE_MICROSTATUSCHANGE = 15; // 麦序信息变更,除人以外的变更都属于这个
    CHATROOM_EVENTTYPE_ROOMMUTED = 16; // 聊天室被集体禁言了，只有拥有权限者可以发言,其他人都处于禁言状态
    CHATROOM_EVENTTYPE_ROOMUNMUTED = 17; // 聊天室取消禁言
    CHATROOM_EVENTTYPE_ROLECHANGE = 18; //成员角色变更
    CHATROOM_EVENTTYPE_USERONLINE=19;//用户下线
    CHATROOM_EVENTTYPE_USEROFFLINE=20;//用户上线
}

message ChatroomEvent {
    ChatroomEventType type = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    int64 to = 3;
    ChatroomMemberInfo from_member_info = 4;
    ChatroomMemberInfo to_member_info = 5;
    map<string, bytes> event_content = 6;
    map<string, string> notify_data = 7;
    map<string, string> attachment = 8;
}

message ChatroomMsgRequest {
    string app_id = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    ChatroomMemberInfo from_user_info = 3; //模拟某个发送者的时候需要带上发送者的信息（发送者在不在房间）
    int64 to = 4; // 如果有被操作着，就是uid, 0 就是没有
    int64 chatroom_id = 5;
    map<string, string> ext = 6;
    ClientType client_type = 7;
    ChatroomMsgType msg_type = 8;
    oneof content {
        string text_content = 9;
        bytes custom_content = 10;
    }
    string msg_id = 11;
    string msg_trace_id = 12;

}

message ChatroomMsgReply {
    roomkit.service.UnifiedResponse ret = 1;
    string msg_id = 2;
}
message FullServiceBroadcastMsgRequest {
    string app_id = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    ChatroomMemberInfo from_user_info = 3; //由业务填写，不提供查询
    map<string, string> ext = 4;
    ClientType client_type = 5;
    ChatroomMsgType msg_type = 6;
    oneof content {
        string text_content = 7;
        bytes custom_content = 8;
    }
    string msg_id = 9;
    string msg_trace_id = 10;

}
message FullServiceBroadcastMsgReply {
    roomkit.service.UnifiedResponse ret = 1;
    string msg_id = 2;
}
message ChatroomBcst {
    string app_id = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    int64 to = 3; // 如果有被操作着，就是uid, 0 就是没有
    ChatroomMemberInfo from_member_info = 4;
    ChatroomMemberInfo to_member_info = 5;

    int64 chatroom_id = 6;
    map<string, string> ext = 7;

    ClientType client_type = 8;
    ChatroomMsgType msg_type = 9;

    oneof content {
        string text_content = 10;
        bytes custom_content = 11;
        ChatroomEvent event_content = 12;
    }

    string msg_id = 13;

    repeated int64 included_uid = 14;
    repeated int64 excluded_uid = 15;

    int64 create_time = 16;
    string msg_trace_id = 17;
}

message MicroOperation {
    int32 operate = 1; // MicroPositionOperate
    int32 old_position = 2; // 原麦位
    int32 new_position = 3; // 现麦位
}

message MsgCopyPostData {
    string app_id = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    int64 to = 3; // 如果有被操作着，就是uid, 0 就是没有
    ChatroomMemberInfo from_member_info = 4;
    ChatroomMemberInfo to_member_info = 5;

    int64 chatroom_id = 6;
    map<string, string> ext = 7;

    ClientType client_type = 8;
    ChatroomMsgType msg_type = 9;

    string text_content = 10;
    bytes custom_content = 11;
    MsgCopyChatroomEvent event_content = 12;

    string msg_id = 13;

    repeated int64 included_uid = 14;
    repeated int64 excluded_uid = 15;

    int64 create_time = 16;
    string msg_trace_id = 17;
}

message MsgCopyChatroomEvent {
    ChatroomEventType type = 1;
    int64 from = 2; // 0 系统 > 0 用户uid
    int64 to = 3;
    ChatroomMemberInfo from_member_info = 4;
    ChatroomMemberInfo to_member_info = 5;
    map<string, string> notify_data = 6;
    map<string, string> attachment = 7;
    repeated MicInfo mic_infos = 8;
    ChatroomInfo room_info = 9;
    MicroOperation mic_op = 10;
}



# docker compose 专用配置，由 configs/chatroom.yaml 派生，仅主机名不同。
# chatroom 服务配置：房间、成员、角色、麦位、房间消息。
# 支持 ${ENV} 形式引用环境变量。

# Chatroom gRPC 监听地址（gateway 的 chatroom_addr 指向这里）
grpc_addr: ":9002"
# pprof 调试监听地址，为空则不启动，例如 "127.0.0.1:6062"
debug_addr: ""
# Core gRPC 地址。etcd:///core 从 etcd 发现全部 core 实例并轮询。
core_addr: "etcd:///core"
etcd:
  endpoints: ["etcd:2379"]
  dial_timeout: 5s
  lease_ttl: 10s
register:
  name: chatroom
  advertise_addr: chatroom:9002
# 优雅退出的最长等待时间
shutdown_timeout: 10s
# 进房 token 及暂存的成员信息有效期
enter_token_ttl: 300s
# 用户断线后保留在房间内的时长，超时未重连则退出所有房间并下麦
offline_leave_after: 60s
# true 时以 debug 级别打印每个 gRPC 响应的完整内容
trace_grpc_reply: false

log:
  # 日志级别：debug / info / warn / error
  level: info
  # 日志文件路径，为空则输出到标准输出
  file: ""
  # 单个日志文件最大 MB
  max_size_mb: 1024
  # 日志保留天数
  max_age_days: 30
  # true 使用便于阅读的控制台格式，false 使用 JSON
  console: true

redis:
  # 单个地址为单机模式，多个地址为集群模式；需与 gateway 使用同一 Redis。
  # 服务依赖键过期事件（禁言/踢人到期、断线超时），启动时会尝试执行
  # CONFIG SET notify-keyspace-events 补上 "Ex"；托管 Redis 禁用 CONFIG 时只会告警，
  # 需要在服务端自行配置 notify-keyspace-events 至少包含 "Ex"。
  addrs: ["redis:6379"]
  password: "${REDIS_PASSWORD}"
  # 单机模式的库号（集群模式固定为 0），过期事件按该库号订阅
  db: 0
  # 连接池大小
  pool_size: 64

mysql:
  # MySQL DSN；表使用 utf8mb4，启动时自动建表/补列
  dsn: "root:${MYSQL_PASSWORD}@tcp(mysql:3306)/orbikit?charset=utf8mb4&parseTime=true&loc=Local"
  # 最大打开连接数
  max_open_conns: 32
  # 最大空闲连接数
  max_idle_conns: 16

kafka:
  # Kafka broker 地址列表
  brokers: ["kafka:9092"]

# 生产的 topic，需与 gateway 的消费配置一致
topics:
  # 房间广播（servicepb.ChatroomBcst）：房间事件与房间消息
  broadcast: orbikit.room.broadcast
  # 应用内全服广播（servicepb.ChatroomBcst）
  fullserver: orbikit.room.fullserver
  # 被踢出房间通知（servicepb.ChatRoomMemberBeKickedBcst）：踢人、拉黑、关房
  kicked: orbikit.room.kicked
  # 杂项事件（servicepb.ChatRoomMiscEventMsg）：封禁用户
  event: orbikit.room.event

nacos:
  enabled: true
  addr: http://nacos:8848
  username: nacos
  password: ${NACOS_PASSWORD}

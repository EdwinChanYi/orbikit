syntax = "proto3";

package orbikit.client.notification;

option go_package = "github.com/EdwinChanYi/orbikit/api/gen/clientpb;clientpb";

import "chatroom_notification.proto";

//通知类型
enum NotificationType {
    UNSUPPORTED = 0; //未定义
    CHATROOM    = 1; //聊天室通知
    P2P         = 2; //单聊通知
    TEAM        = 3; //群聊通知

}

//通知内容
message NotificationContent {
    NotificationType type = 1; //通知类型
    oneof content {
        orbikit.client.chatroom_notification.ChatroomNotificationContent chatroom_notification_content = 2;
    }
}
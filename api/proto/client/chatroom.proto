syntax = "proto3";

package roomkit.client.chatroom;

option go_package = "github.com/yourname/roomkit/api/gen/clientpb;clientpb";

import public "base_service.proto";
import public "chatroom_member.proto";

// 房间链接状态
enum ChatroomConnectionStatus {
    CHATROOM_CONNECTION_STATUS_UNDEFINED        = 0; // 未定义
    CHATROOM_CONNECTION_STATUS_ENTERING         = 1; // 正在进入
    CHATROOM_CONNECTION_STATUS_ENTER_OK         = 2; // 进入聊天室成功
    CHATROOM_CONNECTION_STATUS_ENTER_FAILED     = 3; // 进入聊天室失败
    CHATROOM_CONNECTION_STATUS_LOSE_CONNECTION  = 4; // 和聊天室失去连接
    CHATROOM_CONNECTION_STATUS_SERVER_KICKED    = 5; // 断开网络太久被服务器踢出房间
}

//服务器还在每次链接之前回推送这个登录uid在服务器的房间状态
message ChatroomInStatusBcst {
    int64 uid = 1; //登陆上去本人的uid
    repeated int64 room_id = 2; //房间ID数组
}

// 进入房间 CmdId : CHATROOM_ENTER
message EnterChatroomReq {
    int64 room_id = 1; // 聊天室ID
    string token = 2;
}

message EnterChatroomResp {
    roomkit.client.UnifiedResponse ret                       = 1; // 响应信息
    roomkit.client.chatroom_member.ChatroomMemberBaseInfo me = 2; // 自己在该房间的房间信息
    Chatroom chatroom                                                = 3; // 房间信息
}

//查询最后一次被操作的扩展字段,例如,进不了房间错误码是被拉黑,在里面可以存为什么拉黑
message GetLastOperationExtReq{
    int64 room_id = 1;
}
message GetLastOperationExtResp {
    roomkit.client.UnifiedResponse ret                       = 1; // 响应信息
    map<string,string> remote_ext                                    = 2; // 被操作的时候操作人设置禁区的ext
}

// 退出房间 CmdId : CHATROOM_OUT
message ExitChatroomReq {
    int64 room_id          = 1; // 房间ID
}

message ExitChatroomResp {
    roomkit.client.UnifiedResponse ret                  = 1; // 响应信息
}

message BatchExitChatroomReq {
    repeated int64 room_id          = 1; // 房间ID
}

message BatchExitChatroomResp {
    roomkit.client.UnifiedResponse ret                  = 1; // 响应信息
    repeated int64 error_room_id = 2;
}

// 查询房间信息 CmdId : CHATROOM_GET_INFO
message FetchChatroomInfoReq {
    int64 room_id = 1; // 房间ID
}

// 房间对象
message Chatroom {
    int64 room_id                   = 1; // 聊天室ID
    string room_name                = 2; // 聊天室名
    string announcement             = 3; // 公告
    int64 owner                     = 4; // 房主
    map<string,string> remote_ext   = 5; // 服务端设置的房间扩展字段，客户端不能设置
    int64 online_count              = 6; // 当前在线人数
    bool is_mute_all                = 7; // 聊天室是否正在全员禁言标记，禁言后只有有权限的人可以发言
}

message FetchChatroomInfoResp {
    roomkit.client.UnifiedResponse ret  = 1; // 响应信息
    Chatroom chatroom                           = 2; // 房间信息
}

// 修改房间信息枚举
enum ChatroomUpdateTag {
    UNDEFINED            = 0;
    UPDATE_CHATROOM_NAME = 1; // 房间名
    UPDATE_ANNOUNCEMENT  = 2; // 公告
    UPDATE_REMOTE_EXT    = 3; // 房间远程扩展字段，该枚举只用于解析通知用，如果客户端传入修改，将被忽略
}

message ChatroomInfoField {
    ChatroomUpdateTag type = 1;
    string content         = 2;
}

// 修改房间信息 CmdId : CHATROOM_EDIT_INFO
message ChatroomUpdateReq {
    int64 room_id                           = 1; // 聊天室ID
    repeated ChatroomInfoField updated_info = 2; // 修改房间信息字段
    bool need_notify                        = 3; // 是否需要通知，如果为NO,则不会推送更新到房间内，默认为YES
    map<string,string> notify_ext           = 4; // 放到事件通知里的扩展字段
}

message ChatroomUpdateResp {
    roomkit.client.UnifiedResponse ret = 1; // 响应信息
}

// 踢人原因
enum ChatroomKickReason {
    KICK_BY_UNDEFINED           = 0; // 未定义
    KICK_BY_CHATROOM_INVALID    = 1; // 房间被解散
    KICK_BY_PERSON              = 2; // 被有权限的人踢出房间
    KICK_BY_CONFLICT_LOGIN      = 3; // 多端登陆被踢
    KICK_BY_BLACKLIST           = 4; // 被拉黑
}

// 聊天室被踢结果
message ChatRoomMemberBeKickedBcst {
    int64 room_id                   = 1; // 房间ID
    ChatroomKickReason kicked_reason = 2; // 被踢理由
    int64 duration                   = 3; // 被踢出时长（秒)
    map<string, string> remote_ext   = 4; // 当ChatroomKickReason为KICK_BY_PERSON时这个生效,并且duration大于0聊天室服务器服务器才会持久化(如果用持续踢人存储原因,可以在查询列表的时候重新查出来)
    map<string, string> notify_ext   = 5; // 被踢通知扩展字段,如为什么踢，由踢人的用户传入
    string app_id = 6;
    repeated int64 to_uid = 7; // 发送给谁
    string msg_trace_id = 8;
}

enum ChatRoomMiscEventType {
    MISC_EVENT_UNDEFINED  = 0;
    MISC_EVENT_USER_RESTRAIN = 1; //用户被封号
    MISC_EVENT_UPLOAD_CLIENT_LOG = 2; // 上传客户端日志
}

message RestrainUserMsg {
    int64 uid = 1;
}

message UploadClientLogMsg {
    int64 uid = 1;
    int32 log_type = 2; // 日志类型：roomkit.client.LogType
    int64 log_date = 3; // 日志日期，unixtime 精确到日，单位：毫秒
    string upload_token = 4; // 上传令牌
}

message ChatRoomMiscEventMsg {
    ChatRoomMiscEventType type = 1;
    string app_id = 2;
    oneof  content {
        RestrainUserMsg restrain_info = 3;
        UploadClientLogMsg upload_log = 5;
    }
    string msg_trace_id = 4;
}

message PingHandleReq {
    int64 time_stamp = 1;
}

message PingHandleResp {
    int64 time_stamp = 1;
}

message OnMicInfo {
    int64 room_id = 1;
    int32 up_mic_id = 2;
    int64 up_at = 3; //上mic时毫秒时戳
    int64 down_at = 4; //下mic时毫秒时戳
    enum OffReason {
        NONE = 0;
        USER_QUERY = 1;
        LEAVE_ROOM = 2;
        KICKED_ROOM = 3; //被提出房间和close房间
        BLOCKED_ROOM = 4;
        KICKED_MIC = 5;
        OFFLINE_EXPIRE = 6;
        MIC_CHANGED = 7;
    }
    OffReason reason = 5;
    int32 down_mic_id = 6;
}

message UserMicTimeRequest {
    string app_id = 1;
    int64 uid = 2;
    enum SortType {
        NONE = 0;
        DESC = 1;
        ASC = 2;
    }
    SortType sort_type = 3; //按照上mic时间降序或者升序
    int32 page_size = 4;
    int64  last_up_time = 5; //最后一条记录上mic毫秒时戳，第一次查询给0
    string msg_trace_id = 6;
}

message UserMicTimeReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated OnMicInfo mic_info = 2;
}

message AtRoomInfo {
    int64 room_id = 1;
    int64 enter_at = 2; //进房毫秒时戳
    int64 leave_at = 3; //退房毫秒时戳
    enum LeaveReason {
        NONE = 0;
        USER_QUERY = 1;
        OFF_LINE = 2;
        KICKED = 3;
        BLOCKED = 4;
        CLOSE_ROOM = 5;
    }
    LeaveReason reason = 4;
}

message UserAtRoomTimeRequest {
    string app_id = 1;
    int64 uid = 2;
    enum SortType {
        NONE = 0;
        DESC = 1;
        ASC = 2;
    }
    SortType sort_type = 3; //按照进房时间降序或者升序
    int32 page_size = 4;
    int64 last_enter_time = 5; //最后一条记录进房毫秒时戳，第一次给0
    string msg_trace_id = 6;
}

message UserAtRoomTimeReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated AtRoomInfo room_info = 2;
}

message UploadClientLogRequest {
    string app_id = 1;
    int64 uid = 2;
    int32 log_type = 3; // 日志类型：1 - 聊天室日志，2 - 直播 SDK 日志
    int64 log_date = 4; // 日志日期，unixtime 精确到日，单位：毫秒
    string db_id = 5; // 数据库 ID
    string msg_trace_id = 6;
}

message UploadClientLogReply {
    roomkit.service.UnifiedResponse ret = 1;
    string request_id = 2;
}

message UploadClientLogStatusRequest {
    string app_id = 1;
    int64 uid = 2;
    string msg_trace_id = 3;
}
message UploadClientLogStatusReply {
    roomkit.service.UnifiedResponse ret = 1;
}


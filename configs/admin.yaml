# admin 管理后台配置：登录、会话，以及托管的页面。
# 支持 ${ENV} 形式引用环境变量。

# HTTP 监听地址
http_addr: ":8091"
# 优雅退出的最长等待时间
shutdown_timeout: 10s

# 管理库 orbikit_admin，与业务库 orbikit 分开
mysql_dsn: "root:${MYSQL_PASSWORD}@tcp(localhost:3306)/orbikit_admin?charset=utf8mb4&parseTime=true&loc=Local"

# builder 查询容器 name、status、running、image_id
builder_url: http://127.0.0.1:8092
# 已注册实例所在的 etcd
etcd:
  endpoints: ["127.0.0.1:2379"]
  prefix: /orbikit/services

log:
  # 日志级别：debug / info / warn / error
  level: info
  # 日志文件路径，为空则输出到标准输出
  file: ""
  # 单个日志文件最大 MB
  max_size_mb: 1024
  # 日志保留天数
  max_age_days: 30
  # true 使用便于阅读的控制台格式，false 使用 JSON
  console: true

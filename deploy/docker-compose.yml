name: orbikit

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - ./configs:/app/configs:ro
  environment:
    MYSQL_PASSWORD: orbikit
    REDIS_PASSWORD: ""

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: orbikit
      MYSQL_DATABASE: orbikit
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-porbikit"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orbikit.room.broadcast orbikit.room.fullserver orbikit.room.kicked orbikit.room.event; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  core:
    <<: *service
    build:
      context: ..
      args: { SERVICE: core }
    command: ["-config", "/app/configs/core.yaml"]
    ports: ["9001:9001"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  chatroom:
    <<: *service
    build:
      context: ..
      args: { SERVICE: chatroom }
    command: ["-config", "/app/configs/chatroom.yaml"]
    ports: ["9002:9002"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      core: { condition: service_started }

  webhook:
    <<: *service
    build:
      context: ..
      args: { SERVICE: webhook }
    command: ["-config", "/app/configs/webhook.yaml"]
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      core: { condition: service_started }

  gateway:
    <<: *service
    build:
      context: ..
      args: { SERVICE: gateway }
    command: ["-config", "/app/configs/gateway.yaml"]
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      core: { condition: service_started }
      chatroom: { condition: service_started }

volumes:
  mysql-data:

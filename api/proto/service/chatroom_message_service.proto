syntax = "proto3";

package roomkit.service;

option go_package = "github.com/yourname/roomkit/api/gen/servicepb;servicepb";

import "service_comm.proto";

message QueryChatroomMessageHistoryRequest {
    string app_id = 1;
    int64 chatroom_id = 2;
    int64 begin_time = 3;
    int64 end_time = 4;           
    int32 limit = 5;
    int32 direction = 6;
    repeated int32 type = 7;
    repeated int64 from_ids             = 8; // 消息发出者帐号列表
}

message HistoryMessage {
    string    app_id     = 1;
    int64  chatroom_id = 2;
    int64  msg_create_time = 3;
    string msg = 4; // msg 字段实际对应数据库的 pb 字段
    int64 msg_type = 5;
}

message QueryChatroomMessageHistoryReply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated HistoryMessage datas = 2; 
}

message QueryChatroomMessageHistoryV2Request {
    string app_id = 1;
    int64 chatroom_id = 2;
    int64 begin_time = 3;
    int64 end_time = 4;           
    int32 limit = 5;
    int32 direction = 6;
    repeated int32 type = 7;
    repeated int64 from_ids             = 8; // 消息发出者帐号列表
}

message QueryChatroomMessageHistoryV2Reply {
    roomkit.service.UnifiedResponse ret = 1;
    repeated HistoryMessage datas = 2;
}

service ChatroomMessage {
    rpc QueryChatroomMessageHistory (QueryChatroomMessageHistoryRequest) returns (QueryChatroomMessageHistoryReply) {
    }
    rpc QueryChatroomMessageHistoryV2 (QueryChatroomMessageHistoryV2Request) returns (QueryChatroomMessageHistoryV2Reply) {
    }
}

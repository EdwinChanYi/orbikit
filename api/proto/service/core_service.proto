syntax = "proto3";

package orbikit.service;

option go_package = "github.com/EdwinChanYi/orbikit/api/gen/servicepb;servicepb";

import "service_comm.proto";

message AppInfo {
    uint64 id = 1;
    string app_id = 2;
    string app_secret = 3;
    string name = 4;
    string desc = 5;
    uint64 created_at = 6;
    uint64 updated_at = 7;
    string msg_cp_url = 8;
    string types = 9;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 10;                 // 抄送信息 QPS 限制
    string media_app_id = 11;       // 媒体应用 ID
    string gd_app_id = 12;          // 反垃圾应用 ID
    string text_cp_url = 13;        // 文本消息抄送地址
    string custom_cp_url = 14;      // 自定义消息抄送地址
    int64 text_qps = 15;            // 文本消息 QPS 限制
    int64 custom_qps = 16;          // 自定义消息 QPS 限制
    string media_app_secret = 17;   // 媒体应用密钥
}

message CreateAppRequest {
    string name = 1;
    string desc = 2;
    string msg_cp_url = 3;
    string msg_trace_id = 4;
    string types = 5;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 6;
    string media_app_id = 7;        // 媒体应用 ID
    string gd_app_id = 8;           // 反垃圾应用 ID
    string media_app_secret = 9;    // 媒体应用密钥
}

message CreateAppReply {
    orbikit.service.UnifiedResponse ret = 1;
    AppInfo info = 2;
}

message QueryAppInfoRequest {
    uint64 id = 1;
    string msg_trace_id = 2;
}

message QueryAppInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    AppInfo info = 2;
}

message ApplyClientLoginTokenRequest {
    string app_id = 1;
    int64 uid = 2;
    string msg_trace_id = 3;
}

message ApplyClientLoginTokenReply {
    orbikit.service.UnifiedResponse ret = 1;
    string login_token = 2;
}

message GetClientLoginTokenInfoRequest {
    string login_token = 1;
    string msg_trace_id = 2;
}

message GetClientLoginTokenInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    string app_id = 2;
    int64 uid = 3;
}

message DeleteClientLoginTokenReq {
    string app_id = 1;
    int64 uid = 2;
    string login_token = 3;
    string msg_trace_id = 4;
}

message DeleteClientLoginTokenResp {
    orbikit.service.UnifiedResponse ret = 1;
}

message IsAppValidRequest {
    string app_id = 1;
    string msg_trace_id = 2;
}

message IsAppValidReply {
    orbikit.service.UnifiedResponse ret = 1;
    bool is_valid = 2;
}

message UpdateAppInfoRequest {
    uint64 id = 1;
    bool is_refresh_secret = 2;
    string name = 3;
    string desc = 4;
    string msg_trace_id = 5;
    string msg_cp_url = 6;
    string types = 7;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 8;                  // 抄送信息 QPS 限制
    string media_app_id = 9;        // 媒体应用 ID
    string gd_app_id = 10;          // 反垃圾应用 ID
    string text_cp_url = 11;        // 文本消息抄送地址
    string custom_cp_url = 12;      // 自定义消息抄送地址
    int64 text_qps = 13;            // 文本消息 QPS 限制
    int64 custom_qps = 14;          // 自定义消息 QPS 限制
    string media_app_secret = 15;   // 媒体应用密钥
}
message UpdateAppInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
    AppInfo info = 2;
}

message RestraintUserOperatorRequest {
    string app_id = 1;
    int64 uid = 2;
    int32 action = 3;
    string msg_trace_id = 4;
}

message RestraintUserOperatorReply {
    orbikit.service.UnifiedResponse ret = 1;
}

message GetAppSecretRequest {
    string app_id = 1;
    string msg_trace_id = 2;
}
message GetAppSecretReply {
    orbikit.service.UnifiedResponse ret = 1;
    string secret = 2;
    string msg_cp_url = 3;
    string types = 4;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 5;                  // 抄送信息 QPS 限制
    string media_app_id = 6;        // 媒体应用 ID
    string gd_app_id = 7;           // 反垃圾应用 ID
    string text_cp_url = 8;         // 文本消息抄送地址
    string custom_cp_url = 9;       // 自定义消息抄送地址
    int64 text_qps = 10;            // 文本消息 QPS 限制
    int64 custom_qps = 11;          // 自定义消息 QPS 限制
    string media_app_secret = 12;   // 媒体应用密钥
}

message AppMsgCpQPS {
    string app_id = 1;
    int64 qps = 2;              // 抄送信息 QPS 限制
    int64 text_qps = 3;         // 文本消息 QPS 限制
    int64 custom_qps = 4;       // 自定义消息 QPS 限制
}

message GetAllAppMsgCpQPSRequest {
    string msg_trace_id = 1;
}
message GetAllAppMsgCpQPSReply {
    orbikit.service.UnifiedResponse ret = 1;
    repeated AppMsgCpQPS qps = 2;
}

message UpdateAppCacheInfoRequest {
    string app_id = 1;
    string msg_trace_id = 2;
}
message UpdateAppCacheInfoReply {
    orbikit.service.UnifiedResponse ret = 1;
}

//////////////////////////////////////////////////////////////////////////////////////////////

message GdAppInfo {
    uint64 id = 1;
    string app_id = 2;
    string app_secret = 3;
    string name = 4;
    string desc = 5;
    uint64 created_at = 6;
    uint64 updated_at = 7;
    string msg_cp_url = 8;
    string types = 9;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 10;                 // 抄送信息 QPS 限制
    string media_app_id = 11;       // 媒体应用 ID
    string gd_app_id = 12;          // 反垃圾应用 ID
    string text_cp_url = 13;        // 文本消息抄送地址
    string custom_cp_url = 14;      // 自定义消息抄送地址
    int64 text_qps = 15;            // 文本消息 QPS 限制
    int64 custom_qps = 16;          // 自定义消息 QPS 限制
    uint32 match_level = 17;        // 匹配等级
    bool need_match_base = 18;      // 是否需要匹配基础词库
    bool mark_star = 19;            // 是否开启标星功能
    bool mark_star1 = 20;           // 是否开启特定类型的所有敏感词标星
    string star_types1 = 21;        // 特定类型的所有敏感词标星类型列表
    bool mark_star2 = 22;           // 是否开启特定类型的特定敏感词标星
    string star_types2 = 23;        // 特定类型的特定敏感词标星类型列表
    uint32 app_type = 24;           // (已废弃)反垃圾应用类型
    string no_strict_types = 25;    // 不需要返回拼音匹配结果的敏感词类型列表
    string media_app_secret = 26;   // 媒体应用密钥
    int32 msg_len_max = 27;         // 文本消息长度限制
    int32 msg_digital_count_max = 28;   // 文本消息里面数字个数限制
    string business_moderation_check_url = 29;  // 业务方判断是否需要内容审核的回调 url
    int32 text_count_expire = 30;  // 文本计数时长
    int32 dupli_text_count = 31;  // 重复计数
    bool is_black_dupli_user = 32;  // 是否拉黑发重复消息用户
    bool is_add_word_store = 33;  // 是否将用户重复词添加进词库
}

message CreateGdAppRequest {
    string name = 1;
    string desc = 2;
    string msg_cp_url = 3;
    string msg_trace_id = 4;
    string types = 5;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 6;
    string media_app_id = 7;        // 媒体应用 ID
    string gd_app_id = 8;           // 反垃圾应用 ID
    uint32 match_level = 9;         // 匹配等级
    bool need_match_base = 10;      // 是否需要匹配基础词库
    bool mark_star = 11;            // 是否开启标星功能
    bool mark_star1 = 12;           // 是否开启特定类型的所有敏感词标星
    string star_types1 = 13;        // 特定类型的所有敏感词标星类型列表
    bool mark_star2 = 14;           // 是否开启特定类型的特定敏感词标星
    string star_types2 = 15;        // 特定类型的特定敏感词标星类型列表
    uint32 app_type = 16;           // (已废弃)反垃圾应用类型
    string third_party_app_key = 17;         // (已废弃)第三方反垃圾 AppKey
    string third_party_app_secret = 18;      // (已废弃)第三方反垃圾 AppSecret
    string no_strict_types = 19;    // 不需要返回拼音匹配结果的敏感词类型列表
    string media_app_secret = 20;   // 媒体应用密钥
    int32 msg_len_max = 21;         // 文本消息长度限制
    int32 msg_digital_count_max = 22;   // 文本消息里面数字个数限制
    string business_moderation_check_url = 23;  // 业务方判断是否需要内容审核的回调 url
    int32 text_count_expire = 24;  // 文本计数时长
    int32 dupli_text_count = 25;  // 重复计数
    bool is_black_dupli_user = 26;  // 是否拉黑发重复消息用户
    bool is_add_word_store = 27;  // 是否将用户重复词添加进词库
}

message CreateGdAppReply {
    orbikit.service.UnifiedResponse ret = 1;
    GdAppInfo info = 2;
}

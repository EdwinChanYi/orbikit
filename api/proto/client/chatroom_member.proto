// 设置黑名单 CmdId : CHATROOM_MEMBER_BLOCK
message SettingChatroomInBlackReq {
    ChatroomMemberUpdatedField data = 1; // 用户操作对象
}

message SettingChatroomInBlackResp {
    roomkit.client.UnifiedResponse ret = 1; // 响应信息
}

// 设置禁言 CmdId : CHATROOM_MEMBER_MUTE
message SettingMuteMessageReq {
    ChatroomMemberUpdatedField data = 1; // 用户操作对象
    int64 duration                  = 2; // 禁言多久，如果为0 则永久禁言
}

message SettingMuteMessageResp {
    roomkit.client.UnifiedResponse ret = 1; // 响应信息
}

name: orbikit

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - ./configs:/app/configs:ro
  environment:
    MYSQL_PASSWORD: orbikit
    REDIS_PASSWORD: ""

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: orbikit
      MYSQL_DATABASE: orbikit
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-porbikit"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      ETCD_NAME: etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: orbikit
      ETCD_INITIAL_CLUSTER_STATE: new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orbikit.room.broadcast orbikit.room.fullserver orbikit.room.kicked orbikit.room.event; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  core:
    <<: *service
    build:
      context: ..
      args: { SERVICE: core }
    command: ["-config", "/app/configs/core.yaml"]
    environment:
      MYSQL_PASSWORD: orbikit
      REDIS_PASSWORD: ""
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_healthy }
      nacos-seed: { condition: service_completed_successfully }

  chatroom:
    <<: *service
    build:
      context: ..
      args: { SERVICE: chatroom }
    command: ["-config", "/app/configs/chatroom.yaml"]
    environment:
      MYSQL_PASSWORD: orbikit
      REDIS_PASSWORD: ""
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      etcd: { condition: service_healthy }
      nacos-seed: { condition: service_completed_successfully }
      core: { condition: service_started }

  webhook:
    <<: *service
    build:
      context: ..
      args: { SERVICE: webhook }
    command: ["-config", "/app/configs/webhook.yaml"]
    environment:
      MYSQL_PASSWORD: orbikit
      REDIS_PASSWORD: ""
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      etcd: { condition: service_healthy }
      nacos-seed: { condition: service_completed_successfully }
      core: { condition: service_started }

  gateway:
    <<: *service
    build:
      context: ..
      args: { SERVICE: gateway }
    command: ["-config", "/app/configs/gateway.yaml"]
    environment:
      MYSQL_PASSWORD: orbikit
      REDIS_PASSWORD: ""
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      etcd: { condition: service_healthy }
      nacos-seed: { condition: service_completed_successfully }
      core: { condition: service_started }
      chatroom: { condition: service_started }

  builder:
    <<: *service
    user: root
    build:
      context: ..
      args: { SERVICE: builder }
    command: ["-config", "/app/configs/builder.yaml"]
    environment:
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    volumes:
      - ./configs:/app/configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nacos-seed: { condition: service_completed_successfully }

  admin:
    <<: *service
    build:
      context: ..
      args: { SERVICE: admin }
    command: ["-config", "/app/configs/admin.yaml"]
    ports: ["8091:8091"]
    environment:
      MYSQL_PASSWORD: orbikit
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    depends_on:
      mysql: { condition: service_healthy }
      builder: { condition: service_started }
      nacos-seed: { condition: service_completed_successfully }

  nacos:
    image: nacos/nacos-server:v2.5.5
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  nacos-seed:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    volumes:
      - ./configs:/configs:ro
      - ./nacos/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]

  tools-quickstart:
    image: golang:1.27.4
    profiles: ["tools"]
    working_dir: /src
    volumes: ["..:/src"]
    entrypoint: ["go", "run", "./examples/quickstart", "-core", "core:9001", "-chatroom", "chatroom:9002"]
    environment:
      GOPROXY: https://proxy.golang.org,direct

volumes:
  mysql-data:

syntax = "proto3";

package orbikit.client.chatroom_notification;

option go_package = "github.com/EdwinChanYi/orbikit/api/gen/clientpb;clientpb";

import "chatroom.proto";
import "chatroom_member.proto";
import "chatroom_micro.proto";

// 聊天室通知类型
enum ChatroomEventType {
    UNDEFINED                               = 0; // 未定义
    CHATROOM_EVENTTYPE_ENTER                = 1; // 成员进入聊天室
    CHATROOM_EVENTTYPE_EXIT                 = 2; // 成员离开聊天室
    CHATROOM_EVENTTYPE_ADDBLACK             = 3; // 成员被拉黑
    CHATROOM_EVENTTYPE_REMOVEBLACK          = 4; // 成员被取消拉黑
    CHATROOM_EVENTTYPE_ADDMUTE              = 5; // 成员被设置禁言
    CHATROOM_EVENTTYPE_REMOVEMUTE           = 6; // 成员被取消禁言    
    CHATROOM_EVENTTYPE_CLOSED               = 9; // 聊天室被关闭
    CHATROOM_EVENTTYPE_INFOUPDATED          = 10; // 聊天室信息更新
    CHATROOM_EVENTTYPE_KICKED               = 11; // 聊天室成员被踢
    CHATROOM_EVENTTYPE_UNKICKED             = 12; // 聊天室成员被解除踢出
    CHATROOM_EVENTTYPE_MEMBERUPDATEINFO     = 13; // 成员更新了聊天室的角色信息
    CHATROOM_EVENTTYPE_MICROCHANGE          = 14; // 麦位人员变更
    CHATROOM_EVENTTYPE_MICROSTATUSCHANGE    = 15; // 麦序信息变更,除人以外的变更都属于这个
    CHATROOM_EVENTTYPE_ROOMMUTED            = 16; // 聊天室被集体禁言了，只有拥有权限者可以发言,其他人都处于禁言状态
    CHATROOM_EVENTTYPE_ROOMUNMUTED          = 17; // 聊天室取消禁言
    CHATROOM_EVENTTYPE_ROLECHANGE           = 18; // 聊天室成员角色变更
    CHATROOM_EVENTTYPE_USERONLINE           =19;// 成员上线
    CHATROOM_EVENTTYPE_USEROFFLINE           =20;// 成员下线
}

// 通知事件包含的聊天室成员
message ChatroomNotificationGroup {
    repeated orbikit.client.chatroom_member.ChatroomMemberBaseInfo members = 1; // 通知中相关人员信息
}

// 聊天室通知内容
message ChatroomNotificationContent {
    ChatroomEventType event_type                                                    = 1; // 聊天室通知事件类型
    orbikit.client.chatroom_member.ChatroomMemberBaseInfo source            = 2; // 操作者
    map<string,string> remote_ext                                                   = 3; // 此字段如果是duration大于的时候,才会生效,聊天室服务器会持久化存储
    map<string,string> notify_ext                                                   = 4; // 通知信息扩展字段 当event_type为CHATROOM_EVENTTYPE_ROLECHANGE的时候，里面是一个{"new_role_id":"","old_role_id":""}的键值对
    oneof ext {
        orbikit.client.chatroom.Chatroom chatroom                           = 5; // 客户端收到针对聊天室信息更新的通知, 这个的时候这个字段就有值
        ChatroomNotificationGroup targets                                           = 6; // 客户端收到针对聊天室成员信息更新的通知（昵称，头像，角色，是否禁言 等）, 这个时候这个字段就有值
        orbikit.client.chatroom_micro.ChatroomMicroNotification micros      = 7; // 客户端收到针对聊天室麦位信息变更（麦位上的人，状态 等） 这个时候这个字段就有值
    }
}



message GetGdAppSecretOfAppRequest {    // 根据聊天室appID获取反垃圾密码(mars用)
    string app_id = 1;              // 聊天室 app id
    string msg_trace_id = 2;
}
message GetGdAppSecretOfAppReply {
    orbikit.service.UnifiedResponse ret = 1;
    string secret = 2;
    string msg_cp_url = 3;
    string types = 4;               // 抄送信息类型（ChatroomMsgType）开关，用逗号分隔
    int64 qps = 5;                  // 抄送信息 QPS 限制
    string media_app_id = 6;        // 媒体应用 ID
    string gd_app_id = 7;           // 反垃圾应用 ID
    string text_cp_url = 8;         // 文本消息抄送地址
    string custom_cp_url = 9;       // 自定义消息抄送地址
    int64 text_qps = 10;            // 文本消息 QPS 限制
    int64 custom_qps = 11;          // 自定义消息 QPS 限制
    string gd_app_secret = 12;      // 反垃圾app密码
